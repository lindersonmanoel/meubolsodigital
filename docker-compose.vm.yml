# Stack pra rodar numa VM/PC proprio SEM Cloudflare: Postgres + backend. A API escuta so em
# 127.0.0.1:3000 da maquina; pra ter endereco publico com HTTPS, aponte um tunel (ngrok,
# Tailscale Funnel, cloudflared...) pra http://localhost:3000.
# Uso: cp .env.production.example .env.production  (preencha) e depois
#      docker compose --env-file .env.production -f docker-compose.vm.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    container_name: meu-bolso-digital-db-vm
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      POSTGRES_DB: meu_bolso_digital
    volumes:
      - mbd_pgdata_vm:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbd -d meu_bolso_digital"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meu-bolso-digital-api-vm
    restart: unless-stopped
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Backup diario do PostgreSQL (scripts/backup-loop.sh): dump comprimido em ./backups, guarda 14 dias.
  # COPIE ./backups para fora desta maquina de vez em quando (outro disco/nuvem).
  backup:
    image: postgres:16-alpine
    container_name: meu-bolso-digital-backup-vm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: mbd
      PGDATABASE: meu_bolso_digital
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.production}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]

volumes:
  mbd_pgdata_vm:

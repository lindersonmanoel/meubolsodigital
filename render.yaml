# Blueprint do Render: New > Blueprint > escolha este repositorio.
# Cria so a API (Docker, plano free). O Postgres fica fora, no Neon (free e sem expirar - o
# Postgres free do proprio Render expira em ~30 dias): crie o projeto no Neon e cole a
# connection string (sem pooling) quando o Render pedir DATABASE_URL.
# Limite do free: a API dorme apos ~15 min sem uso (a 1a requisicao demora ~1 min).
# Pra deixar sempre ativa, troque "plan: free" por "starter" (pago).
services:
  - type: web
    name: meubolso-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://meu-bolso-digital-web.vercel.app
      - key: RESEND_API_KEY
        sync: false

# Blueprint do Render: New > Blueprint > escolha este repositorio.
# Cria a API (Docker) e o Postgres ligados entre si, ambos no plano free.
# Limites do free: a API dorme apos ~15 min sem uso (a 1a requisicao demora ~1 min) e o
# Postgres free expira apos ~30 dias - depois disso e preciso trocar de plano ou recriar.
# Pra deixar sempre ativa, troque "plan: free" da API por "starter" (pago).
databases:
  - name: meubolso-db
    databaseName: meu_bolso_digital
    user: mbd
    plan: free

services:
  - type: web
    name: meubolso-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: meubolso-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://meu-bolso-digital-web.vercel.app
      - key: RESEND_API_KEY
        sync: false

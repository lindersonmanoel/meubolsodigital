version: 2
updates:
  # Dependencias do backend (Node): PRs semanais; a suite de testes roda em cada PR.
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      atualizacoes-menores:
        update-types: ["minor", "patch"]

  # Imagem base do Docker (node:20-alpine).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions usadas nos workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

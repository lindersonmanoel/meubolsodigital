name: E2E (navegador)

# Abre o site num Chromium de verdade (desktop e celular) e confere fluxos, layout de celular e seguranca do frontend.
# Sobe o backend e o site estatico sozinho; o PostgreSQL vem como service. Detalhes em e2e/README.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbd
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: meu_bolso_digital_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbd -d meu_bolso_digital_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NODE_ENV: test
      DATABASE_URL: postgresql://mbd:teste@localhost:5432/meu_bolso_digital_e2e
      JWT_SECRET: segredo-so-para-e2e
      FRONTEND_URL: http://localhost:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            e2e/package-lock.json
      - name: Backend - dependencias e migracoes
        working-directory: backend
        run: |
          npm ci
          npm run migrate
      - name: E2E - dependencias e Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E - rodar testes
        working-directory: e2e
        run: npx playwright test
      - name: Relatorio (so' quando falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

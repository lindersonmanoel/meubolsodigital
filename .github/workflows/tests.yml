name: Testes do backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbd
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: meu_bolso_digital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbd -d meu_bolso_digital_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mbd:teste@localhost:5432/meu_bolso_digital_test
      JWT_SECRET: segredo-so-para-ci
      FRONTEND_URL: http://localhost:5500
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Aplicar migracoes no banco de teste
        run: npm run migrate
      - name: Rodar testes
        run: npm test

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas | Meu Bolso Digital</title>
<link rel="icon" href="assets/images/logo-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b66">
<link rel="apple-touch-icon" href="assets/images/logo-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <template id="conteudo-pagina">
    <div class="barra-topo-pagina">
      <div>
        <h1>Metas</h1>
        <p class="hint">Defina objetivos financeiros e acompanhe o progresso.</p>
      </div>
      <button type="button" class="btn btn-primario" id="btn-nova" style="width:auto;padding:10px 18px">+ Nova meta</button>
    </div>

    <p class="alerta alerta-erro" id="erro-geral" hidden></p>

    <section class="painel-formulario" id="painel-formulario" hidden>
      <h2 id="titulo-formulario">Nova meta</h2>
      <form id="form-meta" novalidate>
        <input type="hidden" id="meta-id">
        <div class="linha-campos">
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" maxlength="120" required>
            <p class="erro-campo" data-campo="nome" hidden></p>
          </div>
          <div class="campo">
            <label for="valorObjetivo">Valor objetivo (R$)</label>
            <input type="number" id="valorObjetivo" step="0.01" min="0.01" required>
            <p class="erro-campo" data-campo="valorObjetivo" hidden></p>
          </div>
          <div class="campo">
            <label for="valorAtual">Valor já guardado (R$)</label>
            <input type="number" id="valorAtual" step="0.01" min="0">
            <p class="erro-campo" data-campo="valorAtual" hidden></p>
          </div>
          <div class="campo">
            <label for="prazo">Prazo (opcional)</label>
            <input type="date" id="prazo">
            <p class="erro-campo" data-campo="prazo" hidden></p>
          </div>
        </div>
        <div class="campo">
          <label for="descricao">Descrição (opcional)</label>
          <textarea id="descricao" rows="2" maxlength="2000"></textarea>
        </div>
        <div class="acoes-formulario">
          <button type="submit" class="btn btn-primario" id="btn-salvar">Salvar</button>
          <button type="button" class="btn btn-secundario" id="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <div id="lista-metas"></div>
    <p class="vazio" id="lista-vazia" hidden>Você ainda não tem metas. Crie a primeira acima.</p>
    <p class="spinner-carregando" id="carregando">Carregando...</p>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    Sessao.exigirLogin();
    montarShell("metas");

    const erroGeral = document.getElementById("erro-geral");
    const painel = document.getElementById("painel-formulario");
    const form = document.getElementById("form-meta");
    const listaMetas = document.getElementById("lista-metas");
    const listaVazia = document.getElementById("lista-vazia");
    const carregando = document.getElementById("carregando");

    function escaparHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    function abrirFormulario(meta) {
      form.reset();
      limparErrosCampos(form);
      document.getElementById("meta-id").value = meta ? meta.id : "";
      document.getElementById("titulo-formulario").textContent = meta ? "Editar meta" : "Nova meta";
      if (meta) {
        document.getElementById("nome").value = meta.nome;
        document.getElementById("valorObjetivo").value = meta.valor_objetivo;
        document.getElementById("valorAtual").value = meta.valor_atual;
        document.getElementById("prazo").value = meta.prazo ? meta.prazo.slice(0, 10) : "";
        document.getElementById("descricao").value = meta.descricao || "";
      }
      painel.hidden = false;
      document.getElementById("nome").focus();
    }
    function fecharFormulario() {
      painel.hidden = true;
      form.reset();
    }

    document.getElementById("btn-nova").addEventListener("click", () => abrirFormulario(null));
    document.getElementById("btn-cancelar").addEventListener("click", fecharFormulario);

    function cartaoMeta(meta) {
      const div = document.createElement("div");
      div.className = "cartao-meta";
      const completa = meta.progresso >= 100;
      const iconeCompleta = '<svg class="icone-completa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Meta concluída"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
      div.innerHTML = `
        <div class="topo-meta">
          <h3>${escaparHtml(meta.nome)}${completa ? iconeCompleta : ""}</h3>
          <span>${meta.progresso}%</span>
        </div>
        <div class="valores-meta">
          ${formatarMoeda(meta.valor_atual)} de ${formatarMoeda(meta.valor_objetivo)}
          ${meta.prazo ? ` · prazo: ${formatarData(meta.prazo)}` : ""}
        </div>
        <div class="progresso-barra${completa ? " completa" : ""}">
          <div style="width:${meta.progresso}%"></div>
        </div>
        ${meta.descricao ? `<p class="hint" style="margin-top:8px">${escaparHtml(meta.descricao)}</p>` : ""}
        <div class="tabela-acoes" style="margin-top:10px">
          <button type="button" data-acao="editar">Editar / registrar progresso</button>
          <button type="button" class="excluir" data-acao="excluir">Excluir</button>
        </div>
      `;
      div.querySelector('[data-acao="editar"]').addEventListener("click", () => abrirFormulario(meta));
      div.querySelector('[data-acao="excluir"]').addEventListener("click", () => excluir(meta));
      return div;
    }

    async function excluir(meta) {
      if (!confirm(`Excluir a meta "${meta.nome}"?`)) return;
      try {
        await Api.removerMeta(meta.id);
        await carregarLista();
      } catch (err) {
        mostrarErro(erroGeral, err.message);
      }
    }

    async function carregarLista() {
      mostrarErro(erroGeral, "");
      carregando.hidden = false;
      try {
        const { metas } = await Api.listarMetas();
        listaMetas.innerHTML = "";
        metas.forEach((m) => listaMetas.appendChild(cartaoMeta(m)));
        listaVazia.hidden = metas.length > 0;
      } catch (err) {
        if (err.status === 401) {
          Sessao.encerrar();
          window.location.href = "login.html";
          return;
        }
        mostrarErro(erroGeral, err.message);
      } finally {
        carregando.hidden = true;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mostrarErro(erroGeral, "");
      limparErrosCampos(form);
      const btn = document.getElementById("btn-salvar");
      btn.disabled = true;
      const id = document.getElementById("meta-id").value;
      const payload = {
        nome: document.getElementById("nome").value.trim(),
        valorObjetivo: document.getElementById("valorObjetivo").value,
        valorAtual: document.getElementById("valorAtual").value || 0,
        prazo: document.getElementById("prazo").value || undefined,
        descricao: document.getElementById("descricao").value.trim() || undefined,
      };
      try {
        if (id) await Api.atualizarMeta(id, payload);
        else await Api.criarMeta(payload);
        fecharFormulario();
        await carregarLista();
      } catch (err) {
        if (err.status === 422) mostrarErrosCampos(form, err.body.campos);
        else mostrarErro(erroGeral, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    carregarLista();
  </script>
</body>
</html>

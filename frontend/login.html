<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar | Meu Bolso Digital</title>
<link rel="icon" href="assets/images/logo-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://backend-production-827d.up.railway.app">
<meta name="theme-color" content="#0d3b66">
<link rel="apple-touch-icon" href="assets/images/logo-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main class="tela-auth">
    <div class="auth-caixa">
      <div class="auth-logo">
        <img src="assets/images/logo-icon.png" alt="Meu Bolso Digital">
      </div>
      <div id="local-faixa-instalar"></div>
      <section class="card">
        <h1>Entrar</h1>
        <p class="hint">Acesse sua conta para controlar suas finanças.</p>

        <p class="alerta alerta-erro" id="erro-geral" hidden></p>

        <form id="form-login" novalidate>
          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" autocomplete="email" required maxlength="160">
            <p class="erro-campo" data-campo="email" hidden></p>
          </div>
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" autocomplete="current-password" required maxlength="200">
            <p class="erro-campo" data-campo="senha" hidden></p>
          </div>
          <button type="submit" class="btn btn-primario" id="btn-entrar">Entrar</button>
        </form>
      </section>
      <p class="auth-rodape">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/versao.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    Sessao.redirecionarSeLogado();
    Instalador.montarFaixa(document.getElementById("local-faixa-instalar"));

    const form = document.getElementById("form-login");
    const erroGeral = document.getElementById("erro-geral");
    const btn = document.getElementById("btn-entrar");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mostrarErro(erroGeral, "");
      limparErrosCampos(form);
      btn.disabled = true;
      btn.textContent = "Entrando...";
      try {
        const dados = await Api.login({
          email: document.getElementById("email").value.trim(),
          senha: document.getElementById("senha").value,
        });
        Sessao.salvar(dados.token, dados.usuario);
        window.location.href = "dashboard.html";
      } catch (err) {
        if (err.status === 422) mostrarErrosCampos(form, err.body.campos);
        else mostrarErro(erroGeral, err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>

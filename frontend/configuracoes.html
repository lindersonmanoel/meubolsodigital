<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Configurações | Meu Bolso Digital</title>
<link rel="icon" href="assets/images/logo-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b66">
<link rel="apple-touch-icon" href="assets/images/logo-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <template id="conteudo-pagina">
    <div class="barra-topo-pagina">
      <div>
        <h1>Configurações</h1>
        <p class="hint">Seus dados e sua senha.</p>
      </div>
    </div>

    <section class="card" style="margin-bottom:20px;max-width:520px">
      <h2>Meu perfil</h2>
      <p class="alerta alerta-erro" id="erro-perfil" hidden></p>
      <p class="alerta alerta-sucesso" id="sucesso-perfil" hidden></p>

      <div class="perfil-foto-linha">
        <img id="avatar-preview" src="assets/images/logo-icon.png" alt="Foto de perfil" class="perfil-avatar">
        <div>
          <input type="file" id="input-foto" accept="image/png,image/jpeg,image/webp" hidden>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button type="button" class="btn btn-secundario" id="btn-trocar-foto" style="width:auto;padding:8px 16px">Alterar foto</button>
            <button type="button" class="btn btn-secundario" id="btn-remover-foto" style="width:auto;padding:8px 16px" hidden>Remover foto</button>
          </div>
          <p class="hint" style="margin-top:6px">PNG, JPG ou WEBP. Ajustamos o tamanho automaticamente.</p>
          <p class="erro-campo" data-campo="fotoUrl" hidden></p>
        </div>
      </div>

      <form id="form-perfil" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" maxlength="120" required>
          <p class="erro-campo" data-campo="nome" hidden></p>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" maxlength="160" required>
          <p class="erro-campo" data-campo="email" hidden></p>
        </div>
        <div class="campo">
          <label for="bio">Bio (opcional)</label>
          <textarea id="bio" rows="3" maxlength="280" placeholder="Conte um pouco sobre você..."></textarea>
          <p class="hint" id="contador-bio" style="margin-top:4px">0/280</p>
        </div>
        <button type="submit" class="btn btn-primario" id="btn-salvar-perfil" style="width:auto;padding:10px 20px">Salvar alterações</button>
      </form>
    </section>

    <section class="card" style="margin-bottom:20px;max-width:640px" id="cartao-backup">
      <h2>Backup e restauração</h2>
      <p class="hint">
        Baixe uma cópia de tudo que você cadastrou (categorias, receitas, despesas, metas,
        orçamentos e recorrências) e guarde esse arquivo num lugar seguro. Se um dia perder
        dados por engano, é só restaurar esse arquivo pra recuperar tudo.
      </p>

      <p class="alerta alerta-erro" id="erro-backup" hidden></p>
      <p class="alerta alerta-sucesso" id="sucesso-backup" hidden></p>

      <button type="button" class="btn btn-primario" id="btn-baixar-backup" style="width:auto;padding:10px 18px;margin-bottom:20px">
        Baixar backup completo
      </button>

      <div style="border-top:1px solid var(--borda);padding-top:16px">
        <label for="input-restaurar">Restaurar de um arquivo de backup</label>
        <input type="file" id="input-restaurar" accept="application/json,.json" style="margin-bottom:8px">
        <p class="hint" style="margin-bottom:12px">
          Isso <strong>adiciona</strong> os dados desse arquivo à sua conta atual — não apaga
          nada que já existe. Se restaurar o mesmo backup duas vezes, as movimentações ficam
          duplicadas (categorias repetidas não duplicam).
        </p>
        <button type="button" class="btn btn-secundario" id="btn-restaurar-backup" style="width:auto;padding:10px 18px" disabled>
          Restaurar backup
        </button>
      </div>
    </section>

    <section class="card" style="margin-bottom:20px;max-width:520px">
      <h2>Trocar senha</h2>
      <p class="alerta alerta-erro" id="erro-senha" hidden></p>
      <p class="alerta alerta-sucesso" id="sucesso-senha" hidden></p>
      <form id="form-senha" novalidate>
        <div class="campo">
          <label for="senhaAtual">Senha atual</label>
          <input type="password" id="senhaAtual" autocomplete="current-password" required>
          <p class="erro-campo" data-campo="senhaAtual" hidden></p>
        </div>
        <div class="campo">
          <label for="novaSenha">Nova senha</label>
          <input type="password" id="novaSenha" autocomplete="new-password" minlength="8" maxlength="72" required>
          <p class="erro-campo" data-campo="novaSenha" hidden></p>
        </div>
        <div class="campo">
          <label for="confirmarNovaSenha">Confirmar nova senha</label>
          <input type="password" id="confirmarNovaSenha" autocomplete="new-password" minlength="8" maxlength="72" required>
          <p class="erro-campo" data-campo="confirmarNovaSenha" hidden></p>
        </div>
        <button type="submit" class="btn btn-primario" id="btn-trocar-senha" style="width:auto;padding:10px 20px">Trocar senha</button>
      </form>
    </section>

    <section class="card" style="margin-bottom:20px;max-width:640px" id="cartao-instalar">
      <h2>Instalar o app</h2>
      <p class="hint">
        Instale o Meu Bolso Digital no celular, tablet ou computador pra abrir direto como um
        aplicativo — com ícone próprio, tela cheia e funcionando mesmo com internet instável.
        Funciona em Android, iPhone/iPad, Windows e Mac.
      </p>

      <p class="alerta alerta-sucesso" id="ja-instalado" hidden>Você já está usando o app instalado neste dispositivo.</p>
      <button type="button" class="btn btn-primario" id="btn-instalar" style="width:auto;padding:10px 20px;margin:4px 0 16px" hidden>
        Instalar agora
      </button>

      <div class="instrucoes-instalar" id="instrucoes-instalar">
        <details id="passo-android">
          <summary>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            Celular ou tablet Android (Chrome)
          </summary>
          <ol>
            <li>Se aparecer o botão "Instalar agora" acima, é só tocar nele.</li>
            <li>Se não aparecer: toque nos três pontinhos (⋮) no canto superior direito do Chrome.</li>
            <li>Toque em <strong>"Instalar aplicativo"</strong> (ou "Adicionar à tela inicial").</li>
            <li>Confirme. O ícone do Meu Bolso Digital aparece na tela inicial, como um app normal.</li>
          </ol>
        </details>

        <details id="passo-ios">
          <summary>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            iPhone ou iPad (Safari)
          </summary>
          <ol>
            <li>Abra este site no <strong>Safari</strong> (o instalador não funciona no Chrome do iPhone).</li>
            <li>Toque no ícone de compartilhar (o quadrado com uma seta pra cima), na barra de baixo.</li>
            <li>Role a lista de opções e toque em <strong>"Adicionar à Tela de Início"</strong>.</li>
            <li>Toque em "Adicionar" no canto superior direito. Pronto, o ícone fica na tela inicial.</li>
          </ol>
        </details>

        <details id="passo-windows">
          <summary>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Windows (Chrome ou Edge)
          </summary>
          <ol>
            <li>Se aparecer o botão "Instalar agora" acima, é só clicar nele.</li>
            <li>Se não aparecer: procure um ícone de instalar (um monitor com uma seta, ⊕ ou similar) do lado direito da barra de endereço.</li>
            <li>Clique nele e depois em "Instalar".</li>
            <li>O app abre numa janela própria e ganha um atalho no menu Iniciar.</li>
          </ol>
        </details>

        <details id="passo-mac">
          <summary>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Mac (Chrome, Edge ou Safari)
          </summary>
          <ol>
            <li><strong>Chrome/Edge:</strong> se aparecer o botão "Instalar agora" acima, clique nele; senão, use o ícone de instalar na barra de endereço.</li>
            <li><strong>Safari:</strong> no menu, vá em Arquivo → "Adicionar ao Dock" (ou toque no ícone de compartilhar → "Adicionar ao Dock").</li>
            <li>O app fica com ícone próprio no Dock, como qualquer outro aplicativo do Mac.</li>
          </ol>
        </details>
      </div>
    </section>

    <section class="card" style="max-width:520px">
      <h2>Sair da conta</h2>
      <p class="hint">Encerra sua sessão neste dispositivo.</p>
      <button type="button" class="btn btn-secundario" id="btn-sair-conta" style="width:auto;padding:10px 20px">Sair</button>
    </section>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/versao.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    Sessao.exigirLogin();
    montarShell("configuracoes");

    const formPerfil = document.getElementById("form-perfil");
    const erroPerfil = document.getElementById("erro-perfil");
    const sucessoPerfil = document.getElementById("sucesso-perfil");
    const avatarPreview = document.getElementById("avatar-preview");
    const inputFoto = document.getElementById("input-foto");
    const btnRemoverFoto = document.getElementById("btn-remover-foto");
    const campoBio = document.getElementById("bio");
    const contadorBio = document.getElementById("contador-bio");
    const FOTO_PADRAO = "assets/images/logo-icon.png";

    // undefined = nao mexeu na foto (mantem a que ja estava salva no servidor);
    // string (data URL) = foto nova escolhida; null = pediu pra remover.
    let fotoNova;

    function atualizarBotaoRemover() {
      const temFoto = avatarPreview.src && !avatarPreview.src.endsWith(FOTO_PADRAO);
      btnRemoverFoto.hidden = !temFoto;
    }

    /** Le' o arquivo, recorta um quadrado central e reduz pra no maximo `lado` px, evitando
     * mandar fotos gigantes pro servidor (o limite la' e' de ~700kb em base64). */
    function prepararImagem(arquivo, lado) {
      return new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onload = () => {
          const img = new Image();
          img.onload = () => {
            const menorLado = Math.min(img.width, img.height);
            const sx = (img.width - menorLado) / 2;
            const sy = (img.height - menorLado) / 2;
            const canvas = document.createElement("canvas");
            canvas.width = lado;
            canvas.height = lado;
            canvas.getContext("2d").drawImage(img, sx, sy, menorLado, menorLado, 0, 0, lado, lado);
            resolve(canvas.toDataURL("image/jpeg", 0.85));
          };
          img.onerror = () => reject(new Error("Não consegui abrir essa imagem."));
          img.src = leitor.result;
        };
        leitor.onerror = () => reject(new Error("Não consegui ler o arquivo."));
        leitor.readAsDataURL(arquivo);
      });
    }

    document.getElementById("btn-trocar-foto").addEventListener("click", () => inputFoto.click());
    inputFoto.addEventListener("change", async () => {
      const arquivo = inputFoto.files[0];
      if (!arquivo) return;
      try {
        const dataUrl = await prepararImagem(arquivo, 320);
        fotoNova = dataUrl;
        avatarPreview.src = dataUrl;
        atualizarBotaoRemover();
      } catch (err) {
        mostrarErro(erroPerfil, err.message);
      } finally {
        inputFoto.value = "";
      }
    });
    btnRemoverFoto.addEventListener("click", () => {
      fotoNova = null;
      avatarPreview.src = FOTO_PADRAO;
      atualizarBotaoRemover();
    });

    campoBio.addEventListener("input", () => {
      contadorBio.textContent = `${campoBio.value.length}/280`;
    });

    async function carregarPerfil() {
      try {
        const { usuario } = await Api.me();
        document.getElementById("nome").value = usuario.nome;
        document.getElementById("email").value = usuario.email;
        campoBio.value = usuario.bio || "";
        contadorBio.textContent = `${campoBio.value.length}/280`;
        if (usuario.foto_url) avatarPreview.src = usuario.foto_url;
        atualizarBotaoRemover();
      } catch (err) {
        if (err.status === 401) {
          Sessao.encerrar();
          window.location.href = "login.html";
        }
      }
    }
    carregarPerfil();

    formPerfil.addEventListener("submit", async (e) => {
      e.preventDefault();
      mostrarErro(erroPerfil, "");
      mostrarErro(sucessoPerfil, "");
      limparErrosCampos(formPerfil);
      const btn = document.getElementById("btn-salvar-perfil");
      btn.disabled = true;
      try {
        const payload = {
          nome: document.getElementById("nome").value.trim(),
          email: document.getElementById("email").value.trim(),
          bio: campoBio.value.trim(),
        };
        if (fotoNova !== undefined) payload.fotoUrl = fotoNova || "";
        const { usuario } = await Api.atualizarPerfil(payload);
        fotoNova = undefined;
        const cache = Sessao.usuario();
        Sessao.salvar(Sessao.tokenAtual(), { ...cache, ...usuario });
        mostrarErro(sucessoPerfil, "Perfil atualizado com sucesso.");
        document.getElementById("saudacao").textContent = usuario.email;
      } catch (err) {
        if (err.status === 422 || err.status === 409) mostrarErrosCampos(formPerfil, err.body.campos || { email: err.message });
        else mostrarErro(erroPerfil, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // Backup e restauração
    const erroBackup = document.getElementById("erro-backup");
    const sucessoBackup = document.getElementById("sucesso-backup");
    const inputRestaurar = document.getElementById("input-restaurar");
    const btnRestaurarBackup = document.getElementById("btn-restaurar-backup");
    let textoBackupEscolhido = null;

    document.getElementById("btn-baixar-backup").addEventListener("click", async (e) => {
      const btn = e.currentTarget;
      btn.disabled = true;
      mostrarErro(erroBackup, "");
      mostrarErro(sucessoBackup, "");
      try {
        await Api.baixarCsv(Api.urlBackup(), "backup-meu-bolso-digital.json");
      } catch (err) {
        mostrarErro(erroBackup, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    inputRestaurar.addEventListener("change", async () => {
      mostrarErro(erroBackup, "");
      mostrarErro(sucessoBackup, "");
      const arquivo = inputRestaurar.files[0];
      textoBackupEscolhido = null;
      btnRestaurarBackup.disabled = true;
      if (!arquivo) return;
      try {
        textoBackupEscolhido = await arquivo.text();
        btnRestaurarBackup.disabled = false;
      } catch (err) {
        mostrarErro(erroBackup, "Não consegui ler esse arquivo.");
      }
    });

    btnRestaurarBackup.addEventListener("click", async () => {
      if (!textoBackupEscolhido) return;
      if (!confirm("Isso vai adicionar os dados desse arquivo à sua conta atual (não apaga o que já existe). Continuar?")) return;
      mostrarErro(erroBackup, "");
      mostrarErro(sucessoBackup, "");
      btnRestaurarBackup.disabled = true;
      try {
        const dados = JSON.parse(textoBackupEscolhido);
        const { resultado } = await Api.restaurarBackup(dados);
        let mensagem =
          `Backup restaurado: ${resultado.categorias} categorias, ${resultado.movimentacoes} movimentações, ` +
          `${resultado.metas} metas, ${resultado.orcamentos} orçamentos e ${resultado.recorrencias} recorrências.`;
        if (resultado.avisos && resultado.avisos.length) {
          mensagem += ` ${resultado.avisos.length} item(ns) não importado(s): ${resultado.avisos.slice(0, 5).join("; ")}${resultado.avisos.length > 5 ? "..." : ""}`;
        }
        mostrarErro(sucessoBackup, mensagem);
        inputRestaurar.value = "";
        textoBackupEscolhido = null;
      } catch (err) {
        if (err instanceof SyntaxError) mostrarErro(erroBackup, "Esse arquivo não é um backup válido (JSON inválido).");
        else mostrarErro(erroBackup, err.message);
      } finally {
        btnRestaurarBackup.disabled = !textoBackupEscolhido;
      }
    });

    const formSenha = document.getElementById("form-senha");
    const erroSenha = document.getElementById("erro-senha");
    const sucessoSenha = document.getElementById("sucesso-senha");

    formSenha.addEventListener("submit", async (e) => {
      e.preventDefault();
      mostrarErro(erroSenha, "");
      mostrarErro(sucessoSenha, "");
      limparErrosCampos(formSenha);
      const btn = document.getElementById("btn-trocar-senha");
      btn.disabled = true;
      try {
        const resposta = await Api.trocarSenha({
          senhaAtual: document.getElementById("senhaAtual").value,
          novaSenha: document.getElementById("novaSenha").value,
          confirmarNovaSenha: document.getElementById("confirmarNovaSenha").value,
        });
        // A troca de senha invalida os tokens antigos: guarda o novo pra continuar logado neste aparelho.
        if (resposta && resposta.token) Sessao.salvar(resposta.token, Sessao.usuario());
        formSenha.reset();
        mostrarErro(sucessoSenha, "Senha alterada com sucesso.");
      } catch (err) {
        if (err.status === 422) mostrarErrosCampos(formSenha, err.body.campos);
        else if (err.status === 401) mostrarErrosCampos(formSenha, { senhaAtual: err.message });
        else mostrarErro(erroSenha, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById("btn-sair-conta").addEventListener("click", async () => {
      try { await Api.logout(); } catch (e) { /* mesmo se falhar, encerra localmente */ }
      Sessao.encerrar();
      window.location.href = "login.html";
    });

    // Instalar o app (PWA): abre primeiro a instrucao certa pra plataforma detectada, e
    // liga o botao de instalar quando o navegador oferecer o instalador nativo (nem todo
    // navegador oferece - por isso as instrucoes manuais continuam disponiveis sempre).
    (function configurarInstalador() {
      const btnInstalar = document.getElementById("btn-instalar");
      const avisoInstalado = document.getElementById("ja-instalado");
      const mapaPlataforma = { android: "passo-android", ios: "passo-ios", desktop: "passo-windows", mac: "passo-mac" };
      const idDaPagina = mapaPlataforma[Instalador.plataforma()];
      if (idDaPagina) {
        const detalhe = document.getElementById(idDaPagina);
        if (detalhe) detalhe.open = true;
      }

      if (Instalador.jaInstalado()) {
        avisoInstalado.hidden = false;
        document.getElementById("instrucoes-instalar").hidden = true;
      }

      function atualizarBotao() {
        btnInstalar.hidden = !Instalador.disponivel();
      }
      atualizarBotao();
      document.addEventListener("mbd:instalar-disponivel", atualizarBotao);
      document.addEventListener("mbd:instalado", () => {
        btnInstalar.hidden = true;
        avisoInstalado.hidden = false;
        document.getElementById("instrucoes-instalar").hidden = true;
      });

      btnInstalar.addEventListener("click", async () => {
        btnInstalar.disabled = true;
        await Instalador.instalar();
        btnInstalar.disabled = false;
        atualizarBotao();
      });
    })();
  </script>
</body>
</html>

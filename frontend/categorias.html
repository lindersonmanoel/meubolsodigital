<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorias | Meu Bolso Digital</title>
<link rel="icon" href="assets/images/logo-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b66">
<link rel="apple-touch-icon" href="assets/images/logo-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <template id="conteudo-pagina">
    <div class="barra-topo-pagina">
      <div>
        <h1>Categorias</h1>
        <p class="hint">Organize suas receitas e despesas em categorias.</p>
      </div>
      <button type="button" class="btn btn-primario" id="btn-nova" style="width:auto;padding:10px 18px">+ Nova categoria</button>
    </div>

    <p class="alerta alerta-erro" id="erro-geral" hidden></p>

    <section class="painel-formulario" id="painel-formulario" hidden>
      <h2 id="titulo-formulario">Nova categoria</h2>
      <form id="form-categoria" novalidate>
        <input type="hidden" id="categoria-id">
        <div class="linha-campos">
          <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" maxlength="80" required>
            <p class="erro-campo" data-campo="nome" hidden></p>
          </div>
          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo" required>
              <option value="despesa">Despesa</option>
              <option value="receita">Receita</option>
            </select>
            <p class="erro-campo" data-campo="tipo" hidden></p>
          </div>
        </div>
        <div class="acoes-formulario">
          <button type="submit" class="btn btn-primario" id="btn-salvar">Salvar</button>
          <button type="button" class="btn btn-secundario" id="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <div class="tabela-caixa">
      <table class="tabela">
        <thead>
          <tr><th>Nome</th><th>Tipo</th><th></th></tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio" id="lista-vazia" hidden>Você ainda não tem categorias. Crie a primeira acima.</p>
      <p class="spinner-carregando" id="carregando">Carregando...</p>
    </div>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    Sessao.exigirLogin();
    montarShell("categorias");

    const erroGeral = document.getElementById("erro-geral");
    const painel = document.getElementById("painel-formulario");
    const form = document.getElementById("form-categoria");
    const corpoTabela = document.getElementById("corpo-tabela");
    const listaVazia = document.getElementById("lista-vazia");
    const carregando = document.getElementById("carregando");

    function abrirFormulario(categoria) {
      form.reset();
      limparErrosCampos(form);
      document.getElementById("categoria-id").value = categoria ? categoria.id : "";
      document.getElementById("titulo-formulario").textContent = categoria ? "Editar categoria" : "Nova categoria";
      if (categoria) {
        document.getElementById("nome").value = categoria.nome;
        document.getElementById("tipo").value = categoria.tipo;
      }
      painel.hidden = false;
      document.getElementById("nome").focus();
    }
    function fecharFormulario() {
      painel.hidden = true;
      form.reset();
    }

    document.getElementById("btn-nova").addEventListener("click", () => abrirFormulario(null));
    document.getElementById("btn-cancelar").addEventListener("click", fecharFormulario);

    function linhaCategoria(categoria) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escaparHtml(categoria.nome)}</td>
        <td><span class="badge badge-${categoria.tipo}">${categoria.tipo === "receita" ? "Receita" : "Despesa"}</span></td>
        <td class="tabela-acoes">
          <button type="button" data-acao="editar">Editar</button>
          <button type="button" class="excluir" data-acao="excluir">Excluir</button>
        </td>
      `;
      tr.querySelector('[data-acao="editar"]').addEventListener("click", () => abrirFormulario(categoria));
      tr.querySelector('[data-acao="excluir"]').addEventListener("click", () => excluir(categoria));
      return tr;
    }

    function escaparHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    async function excluir(categoria) {
      if (!confirm(`Excluir a categoria "${categoria.nome}"? Movimentações que a usam ficam sem categoria.`)) return;
      try {
        await Api.removerCategoria(categoria.id);
        await carregarLista();
      } catch (err) {
        mostrarErro(erroGeral, err.message);
      }
    }

    async function carregarLista() {
      mostrarErro(erroGeral, "");
      carregando.hidden = false;
      try {
        const { categorias } = await Api.listarCategorias();
        corpoTabela.innerHTML = "";
        categorias.forEach((c) => corpoTabela.appendChild(linhaCategoria(c)));
        listaVazia.hidden = categorias.length > 0;
      } catch (err) {
        if (err.status === 401) {
          Sessao.encerrar();
          window.location.href = "login.html";
          return;
        }
        mostrarErro(erroGeral, err.message);
      } finally {
        carregando.hidden = true;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mostrarErro(erroGeral, "");
      limparErrosCampos(form);
      const btn = document.getElementById("btn-salvar");
      btn.disabled = true;
      const id = document.getElementById("categoria-id").value;
      const payload = {
        nome: document.getElementById("nome").value.trim(),
        tipo: document.getElementById("tipo").value,
      };
      try {
        if (id) await Api.atualizarCategoria(id, payload);
        else await Api.criarCategoria(payload);
        fecharFormulario();
        await carregarLista();
      } catch (err) {
        if (err.status === 422) mostrarErrosCampos(form, err.body.campos);
        else mostrarErro(erroGeral, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    carregarLista();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recorrências | Meu Bolso Digital</title>
<link rel="icon" href="assets/images/logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d3b66">
<link rel="apple-touch-icon" href="assets/images/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <template id="conteudo-pagina">
    <div class="barra-topo-pagina">
      <div>
        <h1>Recorrências</h1>
        <p class="hint">Receitas e despesas fixas (aluguel, salário, assinaturas...) lançadas automaticamente todo mês.</p>
      </div>
      <button type="button" class="btn btn-primario" id="btn-nova" style="width:auto;padding:10px 18px">+ Nova recorrência</button>
    </div>

    <p class="alerta alerta-erro" id="erro-geral" hidden></p>

    <section class="painel-formulario" id="painel-formulario" hidden>
      <h2 id="titulo-formulario">Nova recorrência</h2>
      <form id="form-recorrencia" novalidate>
        <input type="hidden" id="recorrencia-id">
        <div class="linha-campos">
          <div class="campo">
            <label for="tipo">Tipo</label>
            <select id="tipo">
              <option value="despesa">Despesa</option>
              <option value="receita">Receita</option>
            </select>
          </div>
          <div class="campo">
            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" maxlength="160" required placeholder="Ex.: Aluguel">
            <p class="erro-campo" data-campo="descricao" hidden></p>
          </div>
          <div class="campo">
            <label for="valor">Valor (R$)</label>
            <input type="number" id="valor" step="0.01" min="0.01" required>
            <p class="erro-campo" data-campo="valor" hidden></p>
          </div>
          <div class="campo">
            <label for="diaMes">Dia do mês</label>
            <input type="number" id="diaMes" min="1" max="28" required placeholder="1 a 28">
            <p class="erro-campo" data-campo="diaMes" hidden></p>
          </div>
          <div class="campo">
            <label for="categoriaId">Categoria (opcional)</label>
            <select id="categoriaId"></select>
            <p class="erro-campo" data-campo="categoriaId" hidden></p>
          </div>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-weight:normal">
          <input type="checkbox" id="ativa" checked style="width:auto"> Ativa (gera a movimentação automaticamente todo mês)
        </label>
        <div class="acoes-formulario">
          <button type="submit" class="btn btn-primario" id="btn-salvar">Salvar</button>
          <button type="button" class="btn btn-secundario" id="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <div class="tabela-caixa">
      <table class="tabela">
        <thead>
          <tr><th>Dia</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
      </table>
      <p class="vazio" id="lista-vazia" hidden>Nenhuma recorrência cadastrada ainda.</p>
      <p class="spinner-carregando" id="carregando">Carregando...</p>
    </div>
  </template>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/pwa.js"></script>
  <script>
    Sessao.exigirLogin();
    montarShell("recorrencias");

    const erroGeral = document.getElementById("erro-geral");
    const painel = document.getElementById("painel-formulario");
    const form = document.getElementById("form-recorrencia");
    const corpoTabela = document.getElementById("corpo-tabela");
    const listaVazia = document.getElementById("lista-vazia");
    const carregando = document.getElementById("carregando");
    const selectCategoria = document.getElementById("categoriaId");

    let categorias = [];

    function escaparHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto;
      return div.innerHTML;
    }

    function popularCategorias() {
      const tipoAtual = document.getElementById("tipo").value;
      const relevantes = categorias.filter((c) => c.tipo === tipoAtual);
      selectCategoria.innerHTML =
        '<option value="">Sem categoria</option>' +
        relevantes.map((c) => `<option value="${c.id}">${escaparHtml(c.nome)}</option>`).join("");
    }
    document.getElementById("tipo").addEventListener("change", popularCategorias);

    function abrirFormulario(recorrencia) {
      form.reset();
      limparErrosCampos(form);
      document.getElementById("recorrencia-id").value = recorrencia ? recorrencia.id : "";
      document.getElementById("titulo-formulario").textContent = recorrencia ? "Editar recorrência" : "Nova recorrência";
      document.getElementById("tipo").value = recorrencia ? recorrencia.tipo : "despesa";
      popularCategorias();
      if (recorrencia) {
        document.getElementById("descricao").value = recorrencia.descricao;
        document.getElementById("valor").value = recorrencia.valor;
        document.getElementById("diaMes").value = recorrencia.dia_mes;
        document.getElementById("ativa").checked = recorrencia.ativa;
        selectCategoria.value = recorrencia.categoria_id || "";
      } else {
        document.getElementById("ativa").checked = true;
      }
      painel.hidden = false;
      document.getElementById("descricao").focus();
    }
    function fecharFormulario() {
      painel.hidden = true;
      form.reset();
    }
    document.getElementById("btn-nova").addEventListener("click", () => abrirFormulario(null));
    document.getElementById("btn-cancelar").addEventListener("click", fecharFormulario);

    function linhaRecorrencia(r) {
      const tr = document.createElement("tr");
      const classeValor = r.tipo === "receita" ? "valor-receita" : "valor-despesa";
      tr.innerHTML = `
        <td>Dia ${r.dia_mes}</td>
        <td>${escaparHtml(r.descricao)}</td>
        <td>${r.categoria_nome ? escaparHtml(r.categoria_nome) : '<span class="hint">Sem categoria</span>'}</td>
        <td><span class="badge badge-${r.tipo}">${r.tipo === "receita" ? "Receita" : "Despesa"}</span></td>
        <td class="${classeValor}">${formatarMoeda(r.valor)}</td>
        <td>${r.ativa ? '<span class="badge badge-receita">Ativa</span>' : '<span class="hint">Pausada</span>'}</td>
        <td class="tabela-acoes">
          <button type="button" data-acao="editar">Editar</button>
          <button type="button" class="excluir" data-acao="excluir">Excluir</button>
        </td>
      `;
      tr.querySelector('[data-acao="editar"]').addEventListener("click", () => abrirFormulario(r));
      tr.querySelector('[data-acao="excluir"]').addEventListener("click", () => excluir(r));
      return tr;
    }

    async function excluir(r) {
      if (!confirm(`Excluir a recorrência "${r.descricao}"? As movimentações já lançadas não são apagadas.`)) return;
      try {
        await Api.removerRecorrencia(r.id);
        await carregarLista();
      } catch (err) {
        mostrarErro(erroGeral, err.message);
      }
    }

    async function carregarLista() {
      mostrarErro(erroGeral, "");
      carregando.hidden = false;
      try {
        const { recorrencias } = await Api.listarRecorrencias();
        corpoTabela.innerHTML = "";
        recorrencias.forEach((r) => corpoTabela.appendChild(linhaRecorrencia(r)));
        listaVazia.hidden = recorrencias.length > 0;
      } catch (err) {
        if (err.status === 401) { Sessao.encerrar(); window.location.href = "login.html"; return; }
        mostrarErro(erroGeral, err.message);
      } finally {
        carregando.hidden = true;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mostrarErro(erroGeral, "");
      limparErrosCampos(form);
      const btn = document.getElementById("btn-salvar");
      btn.disabled = true;
      const id = document.getElementById("recorrencia-id").value;
      const payload = {
        tipo: document.getElementById("tipo").value,
        descricao: document.getElementById("descricao").value.trim(),
        valor: document.getElementById("valor").value,
        diaMes: document.getElementById("diaMes").value,
        categoriaId: selectCategoria.value || undefined,
        ativa: document.getElementById("ativa").checked,
      };
      try {
        if (id) await Api.atualizarRecorrencia(id, payload);
        else await Api.criarRecorrencia(payload);
        fecharFormulario();
        await carregarLista();
      } catch (err) {
        if (err.status === 422) mostrarErrosCampos(form, err.body.campos);
        else mostrarErro(erroGeral, err.message);
      } finally {
        btn.disabled = false;
      }
    });

    (async function iniciar() {
      try {
        const resposta = await Api.listarCategorias();
        categorias = resposta.categorias;
      } catch (e) { /* segue sem categorias */ }
      await carregarLista();
    })();
  </script>
</body>
</html>
